apiVersion:  apps/v2
kind: Deployment
metaqdata:
  name: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracker
  template:
    metadata:
      labels:
        app: task-tracker
    spec:
      containers:
        - name: task-tracker
          image: darknight9ee/devops-task-tracker:latest
          ports:
            - containerPort: 5000