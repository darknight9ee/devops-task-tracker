<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DevOps Task Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h2 class="mb-0">
                DevOps Task Tracker
            </h2>

        </div>

        <div class="card-body">

            <form action="/add" method="POST">

                <div class="input-group mb-4">

                    <input
                        type="text"
                        class="form-control"
                        name="title"
                        placeholder="Enter new task"
                        required>

                    <button
                        class="btn btn-primary">

                        Add Task

                    </button>

                </div>

            </form>

            {% if tasks %}

                <ul class="list-group">

                {% for task in tasks %}

                    <li class="list-group-item d-flex justify-content-between align-items-center">

                        <div>

                            {% if task.completed %}

                                <span class="text-decoration-line-through text-success">

                                    {{ task.title }}

                                </span>

                            {% else %}

                                {{ task.title }}

                            {% endif %}

                        </div>

                        <div>

                            {% if not task.completed %}

                            <a
                                href="/complete/{{ task.id }}"
                                class="btn btn-success btn-sm">

                                Complete

                            </a>

                            {% endif %}

                            <a
                                href="/delete/{{ task.id }}"
                                class="btn btn-danger btn-sm">

                                Delete

                            </a>

                        </div>

                    </li>

                {% endfor %}

                </ul>

            {% else %}

                <div class="alert alert-info">

                    No tasks available.

                </div>

            {% endif %}

        </div>

    </div>

</div>

</body>

</html>
